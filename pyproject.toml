[project]
name = "elektro"
dynamic = ["version"]
description = "ephys data for arkitekt"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "zarr>=3.1",
    "xarray>=2024.11.0",
    "dask>=2024.12.1",
    "rath>=4",
    "rekuest>=4",
    "numpy>=1.26; python_version ~= '3.12'",
    "websockets>=15.0.1",
    "pytest>=8.3.5",
    "numcodecs>=0.16.1",
    "obstore>=0.10.0",
    "kanne>=2.5.0",
    "filelock>=3.12",
    "pydantic>=2",
]

[project.optional-dependencies]
turms = ["turms"]
neuron = ["neuron>=8.0.0; sys_platform != 'win32'"]
table = ["pyarrow>=12.0.1", "pandas>=2.2", "duckdb>=1.0"]
# The sparse wire format a spike raster is uploaded in. An extra: a client that never uploads
# a sparse dataset should not carry it.
sparse = ["sporadik>=1.1"]

[tool.uv]
dev-dependencies =  [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "python-semantic-release>=9.21.0",
    "testcontainers==3.7.0",
    "autoflake>=1.7.7,<2",
    "aiohttp>=3.8.3,<4",
    "pytest-aiohttp>=1.0.4,<2",
    "cryptography>=44.0.3",
    "pyjwt>=2.10.1",
    "dokker>=2.8",
    "pillow>=11.2.1",
    "pyarrow>=18.1.0",
    # `SporadikLike.validate` -- and so every sparse test -- cannot run without the format;
    # scipy builds the test rasters.
    "sporadik>=1.1",
    "scipy>=1.11",
    "neuron>=9.0.1; sys_platform != 'win32'",
    "ruff>0.11",
    "basedpyright>=1.21",
]


[tool.hatch.build.targets.sdist]
include = ["elektro"]

[tool.hatch.build.targets.wheel]
include = ["elektro"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.basedpyright]
include = ["elektro"]
exclude = ["**/__pycache__", "tests"]
typeCheckingMode = "standard"

[tool.mypy]
exclude = ["venv/", "tests/"]
ignore_missing_imports = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.ruff.lint]
extend-select = ["ANN", "D1"]

[tool.ruff.lint.per-file-ignores]
# Generated by turms (graphql codegen); regenerated on schema changes.
"elektro/api/schema.py" = ["ANN", "D1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a deployment via testcontainers",
    "neuron: marks tests that require the NEURON simulator",
]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["elektro"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"


[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]
