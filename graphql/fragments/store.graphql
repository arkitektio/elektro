fragment ZarrStore on ZarrStore {
  id
  key
  bucket
  path
  shape
  chunks
  shards
}

fragment ParquetStore on ParquetStore {
  id
  key
  bucket
  path
}

fragment BigFileStore on BigFileStore {
  id
  key
  bucket
  path
  presignedUrl
}

fragment MediaStore on MediaStore {
  id
  key
  bucket
  path
}
fragment SparseStore on SparseStore {
  id
  key
  bucket
  path
  spec
  shape
  # One entry per `layouts/<encoding>` child. Which axis a layout compresses
  # decides which question it answers in one contiguous read.
  layouts {
    path
    encoding
    encodingVersion
    indexedAxis
    indexOrder
    nnz
    dtype
    chunks
    rangeReadable
  }
}
