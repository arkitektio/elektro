fragment Stimulus on Stimulus {
  id
  label
  cell
  kind
  trace {
    id
    store {
      ...ZarrStore
    }
  }
  position
  location
}


fragment DetailStimulus on Stimulus {
  id
  label
  cell
  kind
  trace {
    id
    store {
      ...ZarrStore
    }
  }
  simulation {
    ...Simulation
  }
}