# A link relates a file's bytes to a container, from either end. It is not a
# derivation: a file has no space.
fragment FileLink on FileLink {
  id
  seriesIdentifier
  direction
  valueRelation
  file {
    id
    name
  }
  container {
    __typename
    ... on ArrayDataset {
      id
      name
    }
    ... on AnnotationCollection {
      id
      name
    }
  }
}

fragment File on File {
  id
  name
  store {
    ...BigFileStore
  }
}
