query GetFile($id: ID!) {
  file(id: $id) {
    ...File
  }
}

query SearchFiles(
  $search: String
  $values: [ID!]
  $offset: Int
  $limit: Int
) {
  options: files(
    filters: { search: $search, ids: $values }
    pagination: {offset: $offset, limit: $limit}
  ) {
    value: id
    label: name
  }
}
