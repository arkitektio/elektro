query GetNeuronModel($id: ID!) {
    neuronModel(id: $id) {
        ...NeuronModel
    }
}

query SearchNeuronModels($search: String, $values: [ID!]) {
  options: neuronModels(
    filters: { name: { contains: $search }, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: name
  }
}

query ListNeuronModels($filter: NeuronModelFilter, $pagination: OffsetPaginationInput) {
  neuronModels(filters: $filter, pagination: $pagination) {
    ...NeuronModel
  }
}

# A model's runs, read off the graph: its simulated datasets (a `simulation`
# anchor on it) grouped by the clock they are timed onto. A run is its clock;
# datasets timed onto no clock yet come last under a null clock.
query GetNeuronModelSessions($id: ID!) {
  neuronModel(id: $id) {
    id
    sessions {
      clock {
        ...CoordinateSystem
      }
      datasets {
        ...ArrayDataset
      }
    }
  }
}
