query GetSparseDataset($id: ID!) {
  sparseDataset(id: $id) {
    ...SparseDataset
  }
}

query ListSparseDatasets($filters: SparseDatasetFilter, $pagination: OffsetPaginationInput) {
  sparseDatasets(filters: $filters, pagination: $pagination) {
    ...SparseDataset
  }
}

query SearchSparseDatasets($search: String, $values: [ID!]) {
  options: sparseDatasets(filters: { search: $search, ids: $values }, pagination: { limit: 10 }) {
    value: id
    label: name
  }
}
