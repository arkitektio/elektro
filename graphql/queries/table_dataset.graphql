query GetTableDataset($id: ID!) {
  tableDataset(id: $id) {
    ...TableDataset
  }
}

query ListTableDatasets($filters: TableDatasetFilter, $pagination: OffsetPaginationInput) {
  tableDatasets(filters: $filters, pagination: $pagination) {
    ...TableDataset
  }
}

query SearchTableDatasets($search: String, $values: [ID!]) {
  options: tableDatasets(filters: { search: $search, ids: $values }, pagination: { limit: 10 }) {
    value: id
    label: name
  }
}
