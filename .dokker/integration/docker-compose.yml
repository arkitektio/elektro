version: "3.4"

services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/db:next
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: mikro
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  mikro:
    depends_on:
    - redis
    - db
    - rustfs
    image: jhnnsrs/mikro:next
    command: bash run-debug.sh
    ports:
    - 8456:80
    volumes:
    - ./configs/mikro_next.yaml:/workspace/config.yaml
    - ./public_key.pem:/workspace/public_key.pem
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root
      RUSTFS_ACCESS_KEY: minio_root
    image: rustfs/rustfs:latest
    ports:
    - 8457:9000
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root
      RUSTFS_ACCESS_KEY: minio_root
    image: jhnnsrs/init:next
    volumes:
    - ./configs/rustfs.yaml:/workspace/config.yaml


