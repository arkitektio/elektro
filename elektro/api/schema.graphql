"""A general affine map, given as an M x (N+1) matrix with rows outermost"""
type AffineTransformation implements Transformation @key(fields: "id", resolvable: true) {
  id: ID!
  kind: TransformKind!
  name: String
  input: CoordinateSystem
  output: CoordinateSystem

  """
