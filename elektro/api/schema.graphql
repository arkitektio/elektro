"""Base class for net connection parameters."""
interface NetConnection {
  """The unique identifier of the connection within the model."""
  id: ID!

  """The weight (conductance) of the connection."""
  weight: ElectricalConductance

  """The threshold for the connection."""
  threshold: ElectricPotential

  """The delay for the connection."""
  delay: Duration
}

"""
Input for a synaptic connection between two cells in the model. Each connection has a pre-synaptic cell (the net stimulator) and a post-synaptic cell (the synapse).
"""
input NetConnectionInput {
  """The kind of connection to create."""
  kind: ConnectionKind! = SYNAPSE

  """The unique identifier of the connection within the model."""
  id: ID!

  """The weight (conductance) of the connection."""
  weight: ElectricalConductance = null

  """The threshold for the connection."""
  threshold: ElectricPotential = null

  """The delay for the connection."""
  delay: Duration = null

  """
  The ID of the net stimulator that is the pre-synaptic cell in this connection.
  """
  netStimulator: ID!

  """
  The ID of the synapse that is the post-synaptic cell in this connection.
  """
  synapse: ID!
}

"""
Represents a net stimulator in the model. This will be used to specify the parameters of stimulators in the model.
"""
type NetStimulator {
  """The unique identifier of the stimulator within the model."""
  id: ID!

  """Start time of the first spike."""
  start: Duration!

  """Number of spikes to emit."""
  number: Int!

  """Interval between spikes."""
  interval: Duration
}

"""
Input for a net stimulator in the model. This specifies the parameters of stimulators that drive synaptic connections.
"""
input NetStimulatorInput {
  """The unique identifier of the stimulator within the model."""
  id: ID!

  """Start time of the first spike."""
  start: Duration! = "100 ms"

  """Number of spikes to emit."""
  number: Int! = 1

  """Interval between spikes."""
  interval: Duration = null
}

"""Base class for synaptic stimulus parameters."""
interface NetSynapse {
  """The unique identifier of the synapse within the model."""
  id: ID!

  """The ID of the cell this synapse is located on."""
  cell: String!

  """
  The location on the cell where the synapse is located. This can be a section name, a segment number, or a more complex specification depending on the model.
  """
  location: String!

  """
  The position along the section where the synapse is located, specified as a value between 0 and 1. This is only relevant if the location is specified as a section name.
  """
  position: Float!
}

"""
Input for an exponential synapse, a synaptic stimulus with an exponential rise and decay. This specifies the parameters of synapses in the model.
"""
input NetSynapseInput {
  """The unique identifier of the synapse within the model."""
  id: ID!

  """The kind of synapse model to use."""
  kind: SynapseKind! = EXP2SYN

  """Reversal potential."""
  e: ElectricPotential!

  """Decay time constant."""
  tau2: Duration!

  """Rise time constant."""
  tau1: Duration!

  """The ID of the cell this synapse is located on."""
  cell: ID!

  """
  The location on the cell where the synapse is located. This can be a section name, a segment number, or a more complex specification depending on the model.
  """
  location: ID!

  """
  The position along the section where the synapse is located, specified as a value between 0 and 1. This is only relevant if the location is specified as a section name.
  """
  position: Float! = 0.5
}

type NeuronModel {
  id: ID!
  name: String!
  description: String
  creator: User
  environment: ModEnvironment!
  modelCollections(filters: ModelCollectionFilter, ordering: [ModelCollectionOrder!]! = [], pagination: OffsetPaginationInput): [ModelCollection!]
  mappings(filters: WorkspaceMappingFilter, ordering: [WorkspaceMappingOrder!]! = [], pagination: OffsetPaginationInput): [WorkspaceMapping!]!
  provenanceEntries(pagination: OffsetPaginationInput): [ProvenanceEntry!]!

  """
  The array datasets computed by integrating this model: those carrying a `simulation` anchor on it, in the viewer's organization. A run is its clock: the outputs of one run are those timed onto one clock
  """
  simulatedDatasets: [ArrayDataset!]!

  """
  The model's simulated datasets grouped by the clock they are timed onto: one session per run, since a run is its clock. Read off the graph, never stored. A dataset timed onto two clocks is in both; the datasets timed onto none come last, under a null clock
  """
  sessions: [NeuronModelSession!]!

  """
  The recording sites that are part of this model: every place on it some dataset's values were recorded from, in the viewer's organization
  """
  recordingSites: [RecordingSite!]!

  """
  The stimulus sites that are part of this model: every place on it some dataset's values were injected at, in the viewer's organization
  """
  stimulusSites: [StimulusSite!]!
  config: ModelConfig!
  changes(to: ID = null): [Change!]!
  comparisons: [Comparison!]!
  sectionDominance(
    referenceCell: ID = null
    referenceSection: ID = null

    """
    Weight of the conductance load factor (Σ gbar · area — driven by channel densities like g_pas / gnabar_hh). Defaults to the built-in blend when unset.
    """
    weightConductance: Float = null

    """
    Weight of the membrane capacitance factor (cm · area — driven by specific capacitance). Defaults to the built-in blend when unset.
    """
    weightCapacitance: Float = null

    """
    Weight of the axial coupling factor (∝ diam² / (Ra · length) — driven by section diameter, axial resistivity and length). Defaults to the built-in blend when unset.
    """
    weightAxial: Float = null
  ): [SectionDominance!]!
}

