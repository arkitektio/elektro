name: Release with uv and semantic-release

on:
  push:
    branches: [main, next, "*.x"] # main: stable, next: prereleases, N.x: maintenance

# Needed so semantic-release can push the version-bump commit + tag and create
# the GitHub Release. id-token is for PyPI trusted publishing via `uv publish`.
permissions:
  contents: write
  id-token: write

jobs:
  # Run the suite, then let python-semantic-release decide the next version from
  # the conventional-commit history, bump pyproject, write CHANGELOG.md, commit,
  # tag (vX.Y.Z on main / vX.Y.Z-rc.N on next) and cut a GitHub Release. Only if
  # a release was actually cut do we upload the freshly built wheel to PyPI.
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history + tags

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -m "not integration"

      # Run semantic-release as a CLI on the runner (NOT the Docker action) so
      # the `uv build` build_command can find the `uv` installed by setup-uv.
      # The action runs in its own container where uv is absent -> "uv: command
      # not found". `released` is derived by comparing the next computed version
      # against the last released tag; the build_command in pyproject populates
      # dist/ at the new version. Branch config tags vX.Y.Z on main,
      # vX.Y.Z-rc.N on next.
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SR="uvx --from python-semantic-release semantic-release"
          NEXT=$($SR version --print 2>/dev/null || true)
          LAST=$($SR version --print-last-released 2>/dev/null || true)
          if [ -n "$NEXT" ] && [ "$NEXT" != "$LAST" ]; then
            $SR version
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release required (next='$NEXT', last='$LAST')."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # rc versions upload fine; pip ignores them unless `--pre` is passed.
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        run: uv publish
